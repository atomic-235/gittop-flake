name: Release

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and publish even if the pinned version matches"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - name: Resolve latest upstream release
        id: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/hjr265/gittop/releases/latest | jq -r .tag_name)"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Compare with pinned version
        id: check
        run: |
          current="$(jq -r .version version.json)"
          echo "pinned=${current}" >> "$GITHUB_OUTPUT"
          if [ "$current" = "${{ steps.latest.outputs.version }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pinned hashes
        id: hashes
        if: steps.check.outputs.new == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          base="https://github.com/hjr265/gittop/releases/download/v${VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/gittop-linux_amd64.tar.gz" "$base/gittop_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/gittop-linux_arm64.tar.gz" "$base/gittop_${VERSION}_linux_arm64.tar.gz"
          x64="$(nix hash file --type sha256 --sri "$RUNNER_TEMP/gittop-linux_amd64.tar.gz")"
          arm64="$(nix hash file --type sha256 --sri "$RUNNER_TEMP/gittop-linux_arm64.tar.gz")"
          jq -n --arg v "$VERSION" --arg x "$x64" --arg a "$arm64" \
            '{version: $v, assets: {"x86_64-linux": $x, "aarch64-linux": $a}}' > version.json
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.hashes.outputs.publish == 'true'
        run: nix build --no-link .#default

      - name: Commit and tag
        if: steps.hashes.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add version.json flake.lock
          if ! git diff --cached --quiet; then
            git commit -m "release: gittop ${VERSION}"
            git push origin HEAD:main
          fi
          git tag -f "v${VERSION}"
          git tag -f latest
          git push --force origin "v${VERSION}" latest
